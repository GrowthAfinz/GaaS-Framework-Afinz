<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" style="max-width:100%;height:auto" role="img" aria-labelledby="title desc">
<title id="title">Seguros: execução no SFMC</title><desc id="desc">As fontes passam pela processos_seguros: validar, atualizar elegibilidade, conciliar participações, selecionar públicos e entregar às jornadas. Marcadores retornam ao controle. Decisões de trigger são registradas no lake ou em DE, local ainda a definir.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs>
<rect width="1120" height="1010" rx="24" fill="#f7fafc"/>
<text x="40" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#18364a">Como a estratégia vira execução no SFMC</text>
<text x="40" y="82" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#526579">Integração proposta à processos_seguros • etapas sequenciais</text>
<rect x="70" y="110" width="980" height="110" rx="16" fill="#ffffff" stroke="#d8e3eb"/>
<text x="92" y="145" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">Fontes da operação</text>
<text x="92" y="178" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">CLIENTES ATIVOS • MAPA_SEGUROS • MAPA_MCC • LPs • DEVICE</text>
<text x="92" y="206" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">Fluxo de arquivos: formulários → S3/Athena → retorno da MAPA</text>
<path d="M560 220V250" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="250" width="630" height="90" rx="16" fill="#ffffff" stroke="#d8e3eb"/>
<text x="92" y="285" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">1. Validar volume e atualidade</text>
<text x="92" y="318" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">Uma carga incompleta não deve redefinir os públicos.</text>
<rect x="740" y="250" width="310" height="90" rx="16" fill="#fff6e8" stroke="#ecd3a0"/>
<text x="762" y="285" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">Parâmetros</text>
<text x="762" y="318" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#18364a">SEGUROS_CONFIG_ESTRATEGIA</text>
<path d="M385 340V370" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="370" width="630" height="90" rx="16" fill="#e7f8f8" stroke="#73cdce"/>
<text x="92" y="405" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">2. Atualizar elegibilidade</text>
<text x="92" y="438" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">SEGUROS_ELEGIBILIDADE_CPF</text>
<path d="M385 460V490" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="490" width="630" height="110" rx="16" fill="#ffffff" stroke="#d8e3eb"/>
<text x="92" y="525" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">3. Conciliar participações</text>
<text x="92" y="558" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">SEGUROS_CONTROLE_CPF + histórico de ciclos</text>
<text x="92" y="586" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">Semanas, processamento, posse e inatividade</text>
<rect x="740" y="490" width="310" height="110" rx="16" fill="#eef3ff" stroke="#cdd9f7"/>
<text x="762" y="525" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">Decisões de trigger</text>
<text x="762" y="558" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">Lake ou DE de controle</text>
<text x="762" y="586" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">Armazenamento a definir</text>
<path d="M385 600V630" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="630" width="980" height="110" rx="16" fill="#e7f8f8" stroke="#73cdce"/>
<text x="92" y="665" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">4. Selecionar os seis públicos de entrada</text>
<text x="92" y="698" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">SEG_APTOS_[MULHER / RESIDENCIAL / CELULAR]_MENSAL</text>
<text x="92" y="726" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">SEG_APTOS_[MULHER / RESIDENCIAL / CELULAR]_TRIGGER</text>
<path d="M560 740V770" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="770" width="980" height="110" rx="16" fill="#ffffff" stroke="#d8e3eb"/>
<text x="92" y="805" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">5. Executar jornadas e devolver marcadores</text>
<text x="92" y="838" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">Pablo configura os marcadores de entrada, semana e encerramento.</text>
<text x="92" y="866" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#18364a">Identificar o ciclo em cada atualização; respeitar supressões antes dos contatos.</text>
<path d="M70 825H32V545H70" fill="none" stroke="#526579" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="70" y="930" font-family="Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#18364a">Ao liberar o próximo ciclo, invalidar o anterior.</text>
<text x="70" y="965" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#526579">Mudar a DE de controle, sozinho, não interrompe uma jornada antiga.</text>
</svg>
