<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1220" viewBox="0 0 1280 1220" role="img" aria-labelledby="title desc">
<title id="title">Da fonte à jornada, com retorno de estado.</title><desc id="desc">Fluxo técnico proposto: validar fontes, atualizar elegibilidade, conciliar participações, selecionar mensal, selecionar trigger considerando a mensal autorizada e executar jornadas. Parâmetros de intervalo e inatividade são independentes. As jornadas devolvem marcadores por ciclo; decisões de trigger têm armazenamento a definir no lake ou DE. Falha de carga não pode simular perda de posse.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007c80"/></marker></defs>
<rect width="1280" height="1220" fill="#fff"/>
<text x="40" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#007c80">ESTRATÉGIAS / SEGUROS · 02 · EXECUÇÃO NO SFMC</text>
<text x="40" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#18212a">Da fonte à jornada, com retorno de estado.</text>
<text x="40" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#60717b">Integração proposta à processos_seguros · etapas em sequência; nomes de funções, sem implantação comprovada.</text>
<path d="M40 127H1240" stroke="#d7dfe2"/>
<rect x="40" y="148" width="1200" height="96" fill="#fff" stroke="#d7dfe2"/>
<text x="58" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Fontes e troca de arquivos</text>
<text x="58" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">CLIENTES ATIVOS · MAPA_SEGUROS · MAPA_MCC · formulários</text>
<text x="58" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">processos_seguros: preparar / exportar formulários → S3 / Athena → importar retorno da MAPA.</text>
<path d="M460 244V270" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="270" width="850" height="94" fill="#fff" stroke="#d7dfe2"/>
<text x="88" y="299" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">01</text>
<text x="123" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Validar volume e atualidade</text>
<text x="123" y="327" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Carga incompleta não pode redefinir posse ou gerar públicos.</text>
<path d="M495 364V390" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="390" width="850" height="94" fill="#eff7f6" stroke="#d7dfe2"/>
<text x="88" y="419" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">02</text>
<text x="123" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Atualizar a elegibilidade por CPF</text>
<text x="123" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">SEGUROS_ELEGIBILIDADE_CPF · aptidão por produto e impedimentos.</text>
<path d="M495 484V510" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="510" width="850" height="94" fill="#fff" stroke="#d7dfe2"/>
<text x="88" y="539" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">03</text>
<text x="123" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Conciliar participações e ciclos</text>
<text x="123" y="567" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">SEGUROS_CONTROLE_CPF + histórico · semanas, solicitações, posse e inatividade.</text>
<path d="M495 604V630" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="630" width="850" height="94" fill="#eff7f6" stroke="#d7dfe2"/>
<text x="88" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">04</text>
<text x="123" y="660" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Selecionar as três entradas mensais</text>
<text x="123" y="687" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">SEG_APTOS_[MULHER / RESIDENCIAL / CELULAR]_MENSAL</text>
<path d="M495 724V750" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="750" width="850" height="118" fill="#eff7f6" stroke="#d7dfe2"/>
<text x="88" y="779" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">05</text>
<text x="123" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Selecionar as três entradas de trigger</text>
<text x="123" y="807" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">SEG_APTOS_[MULHER / RESIDENCIAL / CELULAR]_TRIGGER</text>
<text x="123" y="831" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Considerar a mensal ativa e a autorizada nesta execução; registrar descarte.</text>
<path d="M495 868V894" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70" y="894" width="850" height="118" fill="#fff" stroke="#d7dfe2"/>
<text x="88" y="923" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">06</text>
<text x="123" y="924" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Executar jornadas e devolver marcadores</text>
<text x="123" y="951" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Entrada, semana e encerramento identificados por CPF, produto, régua e ciclo.</text>
<text x="123" y="975" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Pablo configura os marcadores; conferir supressões antes dos contatos.</text>
<path d="M70 953H40V557H70" fill="none" stroke="#007c80" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="960" y="390" width="280" height="212" fill="#fff" stroke="#d7dfe2"/>
<text x="978" y="420" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Parâmetros separados</text>
<text x="978" y="447" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">SEGUROS_CONFIG_ESTRATEGIA</text>
<text x="978" y="471" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Entre produtos · 15 dias</text>
<text x="978" y="495" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Sem avanço · 15 dias</text>
<text x="978" y="519" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Uma regra não substitui a outra.</text>
<path d="M960 548H920" fill="none" stroke="#007c80" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<path d="M1100 602V676H920" fill="none" stroke="#007c80" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="960" y="750" width="280" height="262" fill="#fff" stroke="#d7dfe2"/>
<text x="978" y="780" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Decisões de trigger</text>
<text x="978" y="807" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Evento identificado:</text>
<text x="978" y="831" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">liberado, descartado</text>
<text x="978" y="855" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">ou entrada confirmada.</text>
<text x="978" y="879" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b"></text>
<text x="978" y="903" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Lake ou DE de controle.</text>
<text x="978" y="927" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Local ainda a definir.</text>
<path d="M920 808H960" fill="none" stroke="#007c80" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="40" y="1048" width="1200" height="76" fill="#f8fafb" stroke="#d7dfe2"/>
<text x="58" y="1077" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#18212a">RETORNO DE ESTADO · encerrar um ciclo antes de liberar o seguinte</text>
<text x="58" y="1104" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Alterar a DE de controle, sozinho, não interrompe a jornada anterior. Identificar e invalidar o ciclo.</text>
<path d="M40 1150H1240" stroke="#d7dfe2"/>
<text x="40" y="1178" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#60717b">A VALIDAR · campos de posse, D+1 / identidade do evento, BU, chaves, reentrada e fonte oficial de solicitações.</text>
<text x="40" y="1203" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#60717b">Formulário suspende a oferta; contratação depende de confirmação. Estes diagramas não executam automações.</text>
</svg>
