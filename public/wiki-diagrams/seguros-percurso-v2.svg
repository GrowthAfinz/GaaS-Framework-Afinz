<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1154" viewBox="0 0 1280 1154" role="img" aria-labelledby="title desc">
<title id="title">Duas entradas. Um percurso de aquisição.</title><desc id="desc">Desenho proposto de Seguros. Mensal por semanas e trigger por compra em categoria MCC em D+1, sujeito à validação da fonte. Mensal ativa ou autorizada descarta trigger do mesmo produto, sem fila. Trigger ativo permite mensal. Conclusão da última semana inicia espera de 15 dias; mais de 15 dias sem avanço encerra por inatividade, sem nova espera. Formulário suspende ofertas e posse confirmada encerra aquisição do produto.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007c80"/></marker></defs>
<rect width="1280" height="1154" fill="#fff"/>
<text x="40" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#007c80">ESTRATÉGIAS / SEGUROS · 01 · PERCURSO DO CLIENTE</text>
<text x="40" y="76" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#18212a">Duas entradas. Um percurso de aquisição.</text>
<text x="40" y="106" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#60717b">Mensal e trigger compartilham elegibilidade; cada frente tem seu momento de entrada.</text>
<path d="M40 127H1240" stroke="#d7dfe2"/>
<rect x="40" y="148" width="1200" height="90" fill="#eff7f6" stroke="#d7dfe2"/>
<text x="58" y="178" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Elegibilidade compartilhada</text>
<text x="58" y="205" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Conta apta + canal permitido + critérios do seguro; sem solicitação em processamento nem posse confirmada.</text>
<path d="M640 238V258H330V282" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M640 258H950V282" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="56" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#007c80">MENSAL</text>
<text x="676" y="307" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#007c80">TRIGGER POR COMPRA</text>
<text x="56" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Um produto por vez, na sequência definida.</text>
<text x="676" y="335" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Uma oportunidade contextual, com entrada em D+1.*</text>
<path d="M56 351H604" stroke="#d7dfe2"/>
<path d="M676 351H1224" stroke="#d7dfe2"/>
<rect x="56" y="371" width="548" height="88" fill="#fff" stroke="#d7dfe2"/>
<text x="74" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">01</text>
<text x="109" y="401" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Selecionar o próximo seguro</text>
<text x="109" y="428" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Produto elegível + data de liberação respeitada.</text>
<path d="M330 459V480" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="56" y="481" width="548" height="88" fill="#fff" stroke="#d7dfe2"/>
<text x="74" y="510" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">02</text>
<text x="109" y="511" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Entrar e avançar nas semanas</text>
<text x="109" y="538" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">SEM1 → SEM2 → SEM3 → …; registrar cada mudança.</text>
<path d="M330 569V590" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="56" y="591" width="548" height="88" fill="#fff" stroke="#d7dfe2"/>
<text x="74" y="620" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">03</text>
<text x="109" y="621" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Concluir a última semana</text>
<text x="109" y="648" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Só a conclusão inicia a contagem entre produtos.</text>
<path d="M330 679V700" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="56" y="701" width="548" height="88" fill="#eff7f6" stroke="#d7dfe2"/>
<text x="74" y="730" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">04</text>
<text x="109" y="731" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Aguardar 15 dias e selecionar novamente</text>
<text x="109" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Intervalo configurável; triggers continuam abertos.</text>
<path d="M56 745H28V414H56" fill="none" stroke="#007c80" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<text x="56" y="819" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#60717b">Fim da sequência: voltar ao primeiro seguro elegível.</text>
<rect x="676" y="371" width="548" height="113" fill="#fff" stroke="#d7dfe2"/>
<text x="694" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#007c80">01</text>
<text x="729" y="401" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Identificar a compra na categoria</text>
<text x="729" y="428" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Mulher · Saúde e Beleza  |  Residencial · Eletrodomésticos</text>
<text x="729" y="452" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Celular · Eletrônicos; não exige valor mínimo da compra.</text>
<path d="M950 484V505" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="676" y="506" width="548" height="88" fill="#eff7f6" stroke="#d7dfe2"/>
<text x="694" y="536" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Mensal ativa ou autorizada para o mesmo seguro?</text>
<text x="694" y="563" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Conferir também a seleção mensal desta execução.</text>
<path d="M810 594V623" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M1087 594V623" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="820" y="615" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#007c80">SIM</text>
<text x="1097" y="615" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#007c80">NÃO</text>
<rect x="676" y="624" width="264" height="96" fill="#fff" stroke="#d7dfe2"/>
<text x="694" y="654" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Descartar o evento</text>
<text x="694" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Registrar a decisão.</text>
<text x="694" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Não guardar para depois.</text>
<rect x="960" y="624" width="264" height="96" fill="#fff" stroke="#d7dfe2"/>
<text x="978" y="654" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Autorizar a entrada</text>
<text x="978" y="681" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Aplicar os demais critérios</text>
<text x="978" y="705" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">e executar o trigger.</text>
<text x="676" y="758" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#007c80">Trigger ativo permite entrada na mensal.</text>
<text x="676" y="788" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#60717b">*D+1 depende da atualização e da identidade do evento.</text>
<rect x="40" y="850" width="1200" height="76" fill="#f8fafb" stroke="#d7dfe2"/>
<text x="58" y="878" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#18212a">EXCEÇÃO NA MENSAL · mais de 15 dias sem avanço na mesma semana</text>
<text x="58" y="905" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Encerrar por inatividade, invalidar o ciclo anterior e liberar o próximo produto, sem outra espera.</text>
<text x="40" y="970" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#007c80">EM QUALQUER FRENTE · O QUE MUDA DEPOIS DA OFERTA</text>
<rect x="40" y="990" width="270" height="78" fill="#fff" stroke="#d7dfe2"/>
<text x="58" y="1020" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Oferta</text>
<text x="58" y="1047" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Mensal ou trigger</text>
<rect x="350" y="990" width="270" height="78" fill="#eff7f6" stroke="#d7dfe2"/>
<text x="368" y="1020" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Formulário válido</text>
<text x="368" y="1047" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Suspende ofertas do produto</text>
<rect x="660" y="990" width="270" height="78" fill="#fff" stroke="#d7dfe2"/>
<text x="678" y="1020" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Em processamento</text>
<text x="678" y="1047" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Ausência na MAPA não libera</text>
<rect x="970" y="990" width="270" height="78" fill="#eff7f6" stroke="#d7dfe2"/>
<text x="988" y="1020" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#18212a">Posse confirmada</text>
<text x="988" y="1047" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#60717b">Encerra aquisição do produto</text>
<path d="M310 1029H350" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M620 1029H660" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M930 1029H970" fill="none" stroke="#007c80" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M40 1094H1240" stroke="#d7dfe2"/>
<text x="40" y="1122" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#60717b">DESENHO PROPOSTO · ordem dos produtos, cadência, fontes e demais pendências continuam em validação.</text>
</svg>
