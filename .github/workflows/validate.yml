name: Validate release

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Report Live contract and recovery protocol tests
        run: npm run test:report-live
      - name: Canonical partner SQL and TypeScript equivalence
        run: node --test scripts/test-report-live-partner-equivalence.mjs
      - name: TypeScript regression gate (documented main debt)
        run: npm run typecheck:release
      - name: Edge Function type checks
        run: npm run check:edge
      - name: Production build
        run: npm run build
