name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Archive Pages artifact
        run: |
          tar --dereference --hard-dereference \
            --directory dist \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      # O deploy-pages procura o artefato logo depois do upload e, às vezes, a API ainda
      # não o lista ("No artifacts named ... were found"). Espera ele aparecer antes.
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 30); do
            found=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"               --jq "[.artifacts[] | select(.name == \"$ARTIFACT\")] | length" || echo 0)
            if [ "${found:-0}" -gt 0 ]; then
              echo "Artefato $ARTIFACT disponível após $attempt verificação(ões)."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Artefato $ARTIFACT ainda não aparece na API após 150 s; tentando o deploy assim mesmo."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1200000
